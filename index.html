<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magyar Kvíz Verseny 🇭🇺</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#b71c1c,#fff,#16803c);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:720px;
    background:white;
    border-radius:24px;
    padding:35px;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.hidden{display:none!important}

h1{text-align:center;margin-top:0;font-size:36px}
h2{text-align:center}

.subtitle{
    text-align:center;
    color:#666;
    font-size:18px;
    line-height:1.5;
}

input{
    width:100%;
    padding:16px;
    border:2px solid #ddd;
    border-radius:12px;
    font-size:18px;
    margin:20px 0 12px;
    outline:none;
}

input:focus{border-color:#16803c}

button{
    width:100%;
    border:none;
    border-radius:12px;
    padding:16px;
    margin-top:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:#16803c;
    color:white;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    opacity:.9;
}

.dark-button{background:#222}

.category{
    color:white;
    margin-top:15px;
}

.easy{background:#16803c}
.hard{background:#ef6c00}
.impossible{background:#7b1fa2}

.category:hover{opacity:.9}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.badge{
    padding:10px 13px;
    background:#f1f1f1;
    border-radius:10px;
    font-weight:bold;
}

.timer{color:#b71c1c}

.progress-background{
    width:100%;
    height:10px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:30px;
}

.progress{
    height:100%;
    width:0%;
    background:#16803c;
    transition:width .3s;
}

.question{
    font-size:27px;
    font-weight:bold;
    text-align:center;
    line-height:1.4;
    margin:30px 0;
}

.answer{
    background:#f4f4f4;
    color:#222;
    border:2px solid transparent;
    text-align:left;
}

.answer:hover{background:#e5e5e5}

.answer.correct{
    background:#d9f5df;
    border-color:#16803c;
}

.answer.wrong{
    background:#ffe0e0;
    border-color:#b71c1c;
}

.feedback{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    min-height:30px;
    margin:15px 0;
}

.score-big{
    text-align:center;
    font-size:52px;
    font-weight:bold;
    color:#16803c;
    margin:20px 0;
}

.leaderboard-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px;
    margin:8px 0;
    background:#f5f5f5;
    border-radius:12px;
}

.rank{
    width:45px;
    font-weight:bold;
    font-size:20px;
}

.player{
    flex:1;
    font-weight:bold;
    overflow:hidden;
    text-overflow:ellipsis;
}

.points{
    font-weight:bold;
    color:#16803c;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}

.category-info{
    text-align:center;
    font-weight:bold;
    margin-bottom:15px;
}

@media(max-width:600px){
    .container{padding:22px}
    h1{font-size:29px}
    .question{font-size:22px}
    .topbar{font-size:13px}
}
</style>
</head>

<section id="startScreen">

</p>

<input

</button>

</div>

<div class="category-info" id="categoryDisplay"></div>

<div class="progress-background">
<div class="progress" id="progress"></div>
</div>

<div class="question" id="question">

</div>

<div id="answers"></div>

<div class="feedback" id="feedback"></div>

</section>


<!-- EREDMÉNY -->
<section id="resultScreen" class="hidden">

<h1>🎉 Játék vége!</h1>

<p class="subtitle" id="resultText"></p>

<div class="score-big">
<span id="finalScore">0</span>
</div>

<p class="subtitle">pont</p>

<button onclick="showLeaderboard()">
🏆 Ranglista
</button>

<button class="dark-button" onclick="location.reload()">
🔄 Új játék
</button>

</section>


<!-- RANGLISTA -->
<section id="leaderboardScreen" class="hidden">

<h1>🏆 Ranglista</h1>

<p class="subtitle">
Legjobb eredmények
</p>

<div id="leaderboardList"></div>

<button onclick="location.reload()">
← Vissza

</section>
